name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - capy/v0-backend-integration

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.22.3
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run lint
      - name: Allow the unprivileged network namespace the backend runner requires
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - run: env -i PATH="$PATH" HOME="$HOME" npm run test:backend

  local-backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.22.3
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Cache the checksum-pinned Convex backend binary
        uses: actions/cache@v4
        with:
          path: ~/.cache/calledit/convex-local-backend
          key: convex-local-backend-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('tests/qa-runtime/binary-pins.json') }}
      - name: Allow the unprivileged network namespace the loopback lane requires
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - run: env -i PATH="$PATH" HOME="$HOME" npm run test:local-backend

  swift:
    runs-on: macos-26
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      XCODEGEN_VERSION: 2.47.0
      XCODEGEN_SHA256: 6ef12a3ef5327c2c713397f46d9160550f8b1cdc5c925cd884d65c77c9f696cd
      SIMULATOR: platform=iOS Simulator,arch=arm64,name=iPhone 17,OS=26.5
    defaults:
      run:
        working-directory: native-imessage
    steps:
      - uses: actions/checkout@v4
      - name: Report the toolchain
        run: |
          sw_vers
          xcodebuild -version
          xcrun simctl list runtimes
      - name: Install the checksum-pinned XcodeGen
        run: |
          curl --fail --silent --show-error --location --retry 3 \
            --output "$RUNNER_TEMP/xcodegen.zip" \
            "https://github.com/yonaskolb/XcodeGen/releases/download/$XCODEGEN_VERSION/xcodegen.zip"
          echo "$XCODEGEN_SHA256  $RUNNER_TEMP/xcodegen.zip" | shasum -a 256 -c -
          unzip -q "$RUNNER_TEMP/xcodegen.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/xcodegen/bin" >> "$GITHUB_PATH"
      - name: Generate the Xcode project
        run: |
          xcodegen --version
          xcodegen generate
      - name: Fail if XcodeGen changed a tracked file other than the two known stale Info.plist files
        run: |
          changed="$(git status --porcelain --untracked-files=all)"
          {
            echo "### XcodeGen drift"
            echo
            if [ -z "$changed" ]; then
              echo "xcodegen generate left the tree clean."
            else
              echo '```'
              echo "$changed"
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          echo "$changed"
          unexpected="$(echo "$changed" | grep -v -x -e ' M native-imessage/App/Info.plist' -e ' M native-imessage/Extension/Info.plist' -e '' || true)"
          if [ -n "$unexpected" ]; then
            echo "::error::xcodegen generate changed files outside the two known stale Info.plist files"
            echo "$unexpected"
            exit 1
          fi
      - name: Build the host app, the Messages extension and the test bundles unsigned for the simulator
        run: |
          xcodebuild build-for-testing \
            -project CalledItMessages.xcodeproj -scheme CalledItMessages \
            -configuration QA -destination "$SIMULATOR" \
            -derivedDataPath build -quiet \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY= DEVELOPMENT_TEAM=
          products=build/Build/Products/QA-iphonesimulator
          test -d "$products/CalledItMessages.app/PlugIns/CalledItExtension.appex"
          if codesign -dv "$products/CalledItMessages.app" "$products/CalledItMessages.app/PlugIns/CalledItExtension.appex" 2>&1 | grep 'TeamIdentifier=' | grep -v 'not set'; then
            echo "::error::a build product carries a team identifier"
            exit 1
          fi
      - name: Run the Swift unit tests only
        run: |
          xcodebuild test-without-building \
            -project CalledItMessages.xcodeproj -scheme CalledItMessages \
            -configuration QA -destination "$SIMULATOR" \
            -derivedDataPath build -resultBundlePath "$RUNNER_TEMP/CalledItCoreTests.xcresult" \
            -only-testing:CalledItCoreTests
      - name: Report the Swift test count
        if: ${{ !cancelled() }}
        run: |
          xcrun xcresulttool get test-results summary --path "$RUNNER_TEMP/CalledItCoreTests.xcresult" > "$RUNNER_TEMP/summary.json"
          counts="$(jq -r '"\(.totalTestCount) total, \(.passedTests) passed, \(.failedTests) failed, \(.skippedTests) skipped"' "$RUNNER_TEMP/summary.json")"
          echo "CalledItCoreTests: $counts"
          { echo "### CalledItCoreTests"; echo; echo "$counts on $(xcodebuild -version | tr '\n' ' ')"; } >> "$GITHUB_STEP_SUMMARY"
          jq -e '.passedTests > 0 and .failedTests == 0' "$RUNNER_TEMP/summary.json" > /dev/null
      - name: Keep the result bundle when the job fails
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: CalledItCoreTests-xcresult
          path: ${{ runner.temp }}/CalledItCoreTests.xcresult
          if-no-files-found: ignore

  native-ui:
    runs-on: macos-26
    timeout-minutes: 45
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      XCODEGEN_VERSION: 2.47.0
      XCODEGEN_SHA256: 6ef12a3ef5327c2c713397f46d9160550f8b1cdc5c925cd884d65c77c9f696cd
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.22.3
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Report the runner and toolchain
        run: |
          {
            echo "### Runner"
            echo
            echo "- Image: $ImageOS $ImageVersion, $(uname -m), $(sysctl -n hw.ncpu) CPUs, $(( $(sysctl -n hw.memsize) / 1073741824 )) GB"
            echo "- macOS: $(sw_vers -productVersion) ($(sw_vers -buildVersion))"
            echo "- Xcode: $(xcodebuild -version | tr '\n' ' ')"
            echo "- Node: $(node --version)"
            echo "- Passwordless sudo: $(sudo -n true 2>/dev/null && echo yes || echo no)"
          } | tee -a "$GITHUB_STEP_SUMMARY"
          xcrun simctl list runtimes
      - name: Install the checksum-pinned XcodeGen
        run: |
          curl --fail --silent --show-error --location --retry 3 \
            --output "$RUNNER_TEMP/xcodegen.zip" \
            "https://github.com/yonaskolb/XcodeGen/releases/download/$XCODEGEN_VERSION/xcodegen.zip"
          echo "$XCODEGEN_SHA256  $RUNNER_TEMP/xcodegen.zip" | shasum -a 256 -c -
          unzip -q "$RUNNER_TEMP/xcodegen.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/xcodegen/bin" >> "$GITHUB_PATH"
      - name: Require the pinned XcodeGen to be the one the lane will find
        run: |
          # The lane puts /opt/homebrew/bin first on its own PATH, so a Homebrew copy on the image would win.
          found="$(PATH="/opt/homebrew/bin:$PATH" command -v xcodegen)"
          version="$(PATH="/opt/homebrew/bin:$PATH" xcodegen --version)"
          echo "$found: $version"
          test "$version" = "Version: $XCODEGEN_VERSION"
      - name: Cache the checksum-pinned Convex backend binary
        uses: actions/cache@v4
        with:
          path: ~/.cache/calledit/convex-local-backend
          key: convex-local-backend-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('tests/qa-runtime/binary-pins.json') }}
      - name: Run the native UI lane on a new simulator against the loopback backend
        run: |
          env -i PATH="$PATH" HOME="$HOME" DEVELOPER_DIR="$DEVELOPER_DIR" \
            node tests/native-sim/run.mjs --output "$RUNNER_TEMP/native-ui-evidence" \
            --only PickJourneyTests/testFriendConfirmsOnePickThatPersists
      - name: Report the lane's result
        if: ${{ !cancelled() }}
        run: |
          evidence="$RUNNER_TEMP/native-ui-evidence/evidence.json"
          binary="$(find "$HOME/.cache/calledit/convex-local-backend" -type f -name convex-local-backend | head -n 1)"
          {
            echo "### Native UI lane"
            echo
            jq -r '"- Status: \(.status) on \(.sourceRevision)",
              "- Tests: \(.tests.passed // 0) passed, \(.tests.failed // 0) failed, \(.tests.blocked // 0) blocked",
              "- Simulator: \(.simulator.deviceType // "none" | split(".") | last), iOS \(.simulator.runtimeVersion // "?") (\(.simulator.runtimeBuild // "?")), created for this run, Apple account \(.simulator.appleAccount // "?")",
              "- Outbound network: \(.networkIsolation), denied \(.safety.outboundNetwork.enforced // false); app connections outside loopback: \(.safety.outboundNetwork.appContactedNonLoopback // [] | length)",
              "- Backend: \(.backend.release // "?"), executable SHA-256 \(.backend.executableSHA256 // "?")",
              "- Not run: \([.notRun[]?.class] | join(", "))"' "$evidence"
            if [ -n "$binary" ]; then echo "- Backend binary on this runner: $(file -b "$binary"), SHA-256 $(shasum -a 256 "$binary" | cut -d ' ' -f 1)"; fi
            echo
            echo '| Test | Result | Seconds |'
            echo '|---|---|---|'
            jq -r '.tests.cases[]? | "| \(.id) | \(.result) | \(.seconds) |"' "$evidence"
          } | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Keep the lane's evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: native-ui-evidence
          path: |
            ${{ runner.temp }}/native-ui-evidence
            !${{ runner.temp }}/native-ui-evidence/native-ui.xcresult
          if-no-files-found: warn
          retention-days: 14
      - name: Keep the result bundle
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: native-ui-xcresult
          path: ${{ runner.temp }}/native-ui-evidence/native-ui.xcresult
          if-no-files-found: warn
          retention-days: 14
