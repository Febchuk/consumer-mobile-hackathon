name: CalledItMessages
options:
  bundleIdPrefix: com.mikunad.calledit
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: 6555P5TAV6
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1,2"
targets:
  CalledItMessages:
    type: application
    platform: iOS
    sources: [App]
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: CalledIt Messages
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIUserInterfaceStyle: Light
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mikunad.calledit.messages
        PRODUCT_NAME: CalledItMessages
    dependencies:
      - target: CalledItExtension
        embed: true
  CalledItExtension:
    type: app-extension.messages
    platform: iOS
    sources: [Extension]
    info:
      path: Extension/Info.plist
      properties:
        CFBundleDisplayName: Called It
        UIUserInterfaceStyle: Light
        NSExtension:
          NSExtensionPointIdentifier: com.apple.message-payload-provider
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).MessagesViewController
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mikunad.calledit.messages.ext
        PRODUCT_NAME: CalledItExtension
  CalledItUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mikunad.calledit.messages.uitests
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: CalledItMessages
schemes:
  CalledItMessages:
    build:
      targets:
        CalledItMessages: all
        CalledItUITests: [test]
    test:
      targets: [CalledItUITests]
      environmentVariables:
        SHOTS_DIR: $(SHOTS_DIR)
        PAIR_CODE: $(PAIR_CODE)
