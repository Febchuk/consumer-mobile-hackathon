project:
    id: 6a845020-eb60-4d7f-8f98-88878b326aca
session:
    idle_timeout_seconds: 1800
build:
    framework: expo
    env:
        EXPO_PUBLIC_CONVEX_URL: https://reliable-kookabura-33.convex.cloud
    profiles:
        pull-request:
            ios:
                app_id: "69cfdedc-b807-461a-9ecf-5b8c59524439"
                setup_commands:
                    - npm install
                    - if [ ! -d ios ]; then CI=1 npx expo prebuild --platform ios --no-install; fi
                build_commands:
                    - cd ios && if [ ! -d Pods ]; then pod install; fi && WS=$(ls -d *.xcworkspace | head -n 1) && xcodebuild -workspace "$WS" -scheme "${WS%.xcworkspace}" -configuration Release -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' ARCHS=arm64 -derivedDataPath build
                output_path: ios/build/Build/Products/Release-iphonesimulator/*.app
pr_review:
    build:
        kind: revyl
        profile: pull-request
    proof_of_changes:
        enabled: true
        always_verify:
            - The app launches to its first screen (the Called It join screen or the group list).
