test:
  metadata:
    name: called-it-chat-reveal
    platform: ios
    tags:
      - reveal
      - settle
  build:
    name: called-it
  device:
    model: iPhone 16
    orientation: portrait
  # Seeding (outside the phone): chat:demoRevealAt moves QA Pair's reveal to now (admin passcode is read from the Convex env, never stored here).
  blocks:
    - type: validation
      step_description: "The chat header shows \"The reveal is live. Rub the ink.\" and the compose bar reads \"Betting's closed. Reveal time.\"."
    - type: validation
      step_description: "The ink bubble now shows the caption \"Rub to reveal\"."
    - type: instructions
      step_description: "Rub across the ink bubble with a few separate swipes from left to right (avoid chained fast swipes, which trigger iOS swipe-back)."
    - type: validation
      step_description: "The bubble shows \"About you · Does revyl_qa_2 pass every test?\" with Yes 60% and No 40% and the caption \"tap to call it\"."
    - type: instructions
      step_description: "Tap the revealed bubble."
    - type: validation
      step_description: "A sheet shows \"Your call. Honor system.\" with True and False buttons and a veto link."
    - type: instructions
      step_description: "Tap True."
    - type: validation
      step_description: "The sheet shows Yes with a ✓ and the pts totals."
    - type: instructions
      step_description: "Close the sheet by swiping it down."
    - type: validation
      step_description: "The chat shows the bubble marked ✓ Yes / called, and a blue message \"It was Yes. Does revyl_qa_2 pass every test?\" with the payout line \"🦊 zz_qa_a +40\"."
