test:
  metadata:
    name: called-it-chat-sealed-bet
    platform: ios
    tags:
      - sealed
      - reveal
  build:
    name: called-it
  device:
    model: iPhone 16
    orientation: portrait
  # Seeding (outside the phone): chat:createBet from zz_qa_a about the test user (kind yesno, amount 60 on Yes) and chat:stake from zz_qa_b (40 on No), using the Convex CLI against QA Pair only.
  blocks:
    - type: instructions
      step_description: "Scroll the chat to the bottom."
    - type: validation
      step_description: "A grey speckled \"invisible ink\" bubble shows only the pill \"@revyl_qa_2\" with the bettors' emoji reactions in the top-right corner and the caption \"Unlocks at 5:00 · 2 friends are in\"."
    - type: validation
      step_description: "The question and the bet options are not readable anywhere in the bubble."
    - type: instructions
      step_description: "Tap the ink bubble."
    - type: validation
      step_description: "Nothing happens: no sheet opens and the ink stays."
