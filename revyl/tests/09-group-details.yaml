test:
  metadata:
    name: called-it-chat-group-details
    platform: ios
    tags:
      - groups
      - leaderboard
  build:
    name: called-it
  device:
    model: iPhone 16
    orientation: portrait
  # Precondition: inside the QA Pair chat.
  blocks:
    - type: instructions
      step_description: "Tap the group name \"QA Pair ›\" in the header."
    - type: validation
      step_description: "A details sheet shows the group name, \"6 people · invite code qapair282\", and \"THE DINNER POT\" with a points total."
    - type: validation
      step_description: "A LEADERBOARD lists every member ranked by points, with the player marked \"(you)\"."
    - type: validation
      step_description: "A \"Riding on you\" card shows how many bets and points are about the player."
